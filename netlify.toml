[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/collection/catalogue"
  to = "/collections/catalogue"
  status = 301

[[redirects]]
  from = "/collection/*"
  to = "/collections/:splat"
  status = 301

[[redirects]]
  from = "/catalogue"
  to = "/collections/catalogue"
  status = 301

[[redirects]]
  from = "/products/*.txt"
  to = "/products/_.txt"
  status = 200

[[redirects]]
  from = "/products/*"
  to = "/products/_.html"
  status = 200

[[redirects]]
  from = "/collections/*.txt"
  to = "/collections/_.txt"
  status = 200

[[redirects]]
  from = "/collections/*"
  to = "/collections/_.html"
  status = 200

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/catalogue/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
